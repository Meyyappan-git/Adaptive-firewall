firewall:
  mode: live # options: live (actual OS & network enforcement), simulation (sandbox testing)
  enforcement:
    kernel_firewall: true # Windows Defender Firewall (netsh) / Linux iptables / macOS pfctl
    app_middleware: true # Reject blocked IPs at application transport layer

thresholds:
  port_scan_ports: 5
  connection_rate: 20
  failed_connections: 10
  bandwidth_bytes_per_second: 1000000

threat_score:
  rule_weight: 0.6
  ml_weight: 0.3
  behavior_weight: 0.1

actions:
  low: allow
  moderate: monitor
  high: temporary_block
  critical: block

temporary_block:
  default_duration_seconds: 300
